name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            set -e
            cd /home/codetail/frontend
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build --build-arg BUILD_DATE=$(date +%s)
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps
            echo "Waiting for app to start..."
            sleep 15
            curl -sf http://localhost:3001 > /dev/null || exit 1
            echo "Deploy complete."
